name: CI & Backend Health Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Daily health check at 08:00 UTC to proactively detect Alo API breaking changes
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Build & Typecheck
        run: npm run build

      - name: Run Test Suite
        env:
          ALO_REMEMBER_TOKEN: ${{ secrets.ALO_REMEMBER_TOKEN }}
        run: npm test
